      [
        "^[wｗ]{2,}$",
        "ㅋ{2,}",
        "^(ja){2,}j?a?$",
        "^(ha){2,}h?$",
        "^k{4,}$",
        "^x+d+$",
        "哈哈",
        "^(lo)+l$",
        "^(ah){2,}$",
        "хаха",
        "^(he){3,}$",
      ]
  surprise:
    label: surprised
    words:
      [
        HUH,
        WHAT,
        wtf,
        WTF,
        "?!",
        "!?",
        "！？",
        "？！",
        "は？",
        "やば",
        "やばい",
        "マジ",
        "헐",
        "뭐야",
        "什么",
        "😮",
        "😯",
        "🫢",
      ]
    suffixes: [Huh, HUH, What, WHAT, Shock, Omg, OMG]
    message_patterns:
      [
        "^[?？!！]{2,}$",
        "^[あえぁぇ]+[!！?？ー～]*$",
        "^hu+h+[?!]*$",
        "^wha+t+[?!]*$",
      ]
  scare:
    label: scared
    words:
      [
        monkaS,
        monkaW,
        monkaGIGA,
        "D:",
        WutFace,
        AAAA,
        AAAAA,
        JUMPSCARE,
        "jump scare",
        "怖",
        "무서",
        "😨",
        "😰",
        "😳",
      ]
    suffixes: [Scared, Fear, Monka, Spooky, Scream]
    patterns: ["^a{4,}h*$"]
  fail:
    label: a fail
    words:
      [
        F,
        L,
        LL,
        Sadge,
        BibleThump,
        NotLikeThis,
        BigSad,
        FeelsBadMan,
        RIP,
        rip,
        NOOO,
        THREW,
        threw,
        copium,
        Copium,
        "；；",
        "T_T",
        "😭",
        "💔",
      ]
    suffixes: [Sad, SAD, Cry, CRY, Rip, RIP, F, L, Dead]
    patterns: ["ㅠ{2,}", "ㅜ{2,}", "^no{3,}$"]
  clip:
    label: asking to clip it
