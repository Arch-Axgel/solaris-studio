      [
        LUL,
        LULW,
        KEKW,
        OMEGALUL,
        ICANT,
        KEK,
        LOL,
        lol,
        LMAO,
        lmao,
        LMFAO,
        lmfao,
        xD,
        XD,
        pepeLaugh,
        HAHAHA,
        hahaha,
        4Head,
        Jebaited,
        EleGiggle,
        mdr,
        MDR,
        ptdr,
        "😂",
        "🤣",
        "💀",
        "草",
      ]
