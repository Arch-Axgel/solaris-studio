genres:
  shooter:
    label: shooter
    highlights:
      kills and multi-kills, a clutch against several enemies, a flick, one-tap or
      no-scope, wiping a squad, a round-winning play, and deaths that are funny or unfair
    callouts:
      [
        "got him",
        "one tap",
        "headshot",
        "ace",
        "clutch",
        "one left",
        "one hp",
        "he's one",
        "no scope",
        "double kill",
        "triple",
        "wiped",
        "let's go",
      ]
  battle_royale:
    label: battle royale
    highlights:
      winning the game, the final fight, wiping a squad, a clutch with teammates
      down, a third-party ambush, and getting knocked or finished in a funny way
    callouts:
      [
        "victory royale",
        "winner",
        "we won",
        "one left",
        "knocked",
        "cracked",
        "squad wiped",
        "last circle",
        "third party",
        "got him",
        "let's go",
      ]
  moba:
    label: MOBA
    highlights:
      winning teamfights, multi-kills up to a pentakill, stealing a big objective,
      an outplay or escape at low health, a game-winning push, and throws
    callouts:
      [
        "penta",
        "quadra",
        "triple",
        "ace",
        "steal",
        "stole",
        "outplay",
        "baron",
        "dragon",
        "roshan",
        "shutdown",
        "backdoor",
        "gg",
        "let's go",
      ]
  sports:
    label: sports game
    highlights:
      goals and winning goals, saves, last-minute equalisers, skill moves, dunks,
      touchdowns and home runs, comebacks, and funny own goals
    callouts:
      [
        "goal",
        "scored",
        "what a goal",
        "top bins",
        "save",
        "last minute",
        "overtime",
        "penalty",
        "touchdown",
        "dunk",
        "home run",
        "buzzer beater",
      ]
  fighting:
    label: fighting game
    highlights:
      big combos, perfect rounds, comebacks from low health, parries and reads, and
      the round-winning hit
    callouts:
      ["combo", "perfect", "parry", "comeback", "one hit", "read", "let's go"]
  racing:
    label: racing game
    highlights: last-lap overtakes, photo finishes, big crashes, and winning the race
    callouts:
      [
        "overtake",
        "crash",
        "first place",
        "photo finish",
        "last lap",
        "wrecked",
      ]
  horror:
    label: horror game
    highlights: jump scares and the scream, being chased, a narrow escape, getting caught
    callouts:
      [
        "what was that",
        "oh my god",
        "run",
        "it's behind",
        "nope",
        "get away",
        "caught",
      ]
  soulslike:
    label: action / soulslike
    highlights:
      beating a boss (especially first try or at low health), a boss's new phase,
      dying at the last moment, a clean parry or dodge, and rage
    callouts:
      [
        "boss",
        "phase two",
        "you died",
        "first try",
        "one hit",
        "parry",
        "no way",
        "let's go",
        "finally",
      ]
  adventure:
    label: action-adventure
    highlights:
      beating a boss or a hard section, discovering something, a clever solve, and
      a funny death or glitch
    callouts: ["boss", "finally", "let's go", "no way", "found it", "secret"]
  sandbox:
    label: sandbox / survival
    highlights:
      a raid or fight, a betrayal, a rare find, a death (especially a funny one),
      revealing a build, and chaos with friends
    callouts:
      ["raid", "diamonds", "betrayed", "base", "run", "we're dead", "no way"]
  speedrun:
    label: speedrun
    highlights:
      a personal best or world record, pulling off a hard skip or trick, and the
      mistake that kills the run
    callouts:
      ["pb", "world record", "wr", "skip", "trick", "reset", "gold", "split"]
  party:
    label: party game
    highlights:
      an impostor reveal, a betrayal, a chaotic fail, a clutch win, and laughing with
      friends
    callouts: ["sus", "impostor", "vote", "betrayed", "crown", "let's go"]
  strategy:
    label: strategy / chess
    highlights: a brilliant move, a blunder, a comeback, and checkmate
    callouts:
      ["blunder", "brilliant", "checkmate", "mate in", "sacrifice", "gg"]
  reaction:
    label: reaction
    highlights:
      the streamer's biggest reactions to what they're watching (shock, laughter, a
      strong take), with the moment that caused it
    callouts: ["no way", "what", "oh my god", "bro", "let's go"]
  generic:
    label: game
    highlights:
      a big play or win, a funny or unlucky death, a surprise, and the streamer's
      reaction to it
    callouts: ["let's go", "no way", "oh my god", "got him", "what"]

