# The Solaris Studio plugin SDK as an installable package, for developing a
# plugin outside the app. Solaris Studio itself never installs it: the app puts
# its own copy on each plugin's PYTHONPATH (plugins/runner.py).
# Not published to PyPI; install it from this repository (docs/developers/sdk.md).
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solarisstudio-sdk"
dynamic = ["version"]
description = "Write pipelines for Solaris Studio: read the job, report progress, return moments, check the manifest."
# A PEP 639 licence expression. No "License ::" classifier: setuptools 77 and
# later refuse a licence expression together with one.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["solaris-studio", "plugin", "sdk", "video", "highlights"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Reading a plugin's solarisstudio.yaml.
yaml = ["PyYAML>=6"]
# Running a plugin's own tests on the developer's PC (never inside the app).
test = ["pytest"]

[project.scripts]
solarisstudio-sdk = "solarisstudio_sdk.__main__:main"

[project.urls]
Documentation = "https://github.com/Arch-Axgel/solaris-studio/blob/main/docs/developers/sdk.md"
Source = "https://github.com/Arch-Axgel/solaris-studio/tree/main/sdk/python"
Issues = "https://github.com/Arch-Axgel/solaris-studio/issues"
Changelog = "https://github.com/Arch-Axgel/solaris-studio/blob/main/sdk/python/CHANGELOG.md"

[tool.setuptools]
packages = ["solarisstudio_sdk"]

[tool.setuptools.package-data]
solarisstudio_sdk = ["schema/*.json", "py.typed", "templates/**/*"]

# Python's byte-code caches, which running a template's tests leaves beside
# it, never go into the wheel ("*" here also matches inside folders).
[tool.setuptools.exclude-package-data]
solarisstudio_sdk = ["*.pyc"]

[tool.setuptools.dynamic]
version = {attr = "solarisstudio_sdk.__version__"}
